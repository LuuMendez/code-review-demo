name: Code Review Checks

on:
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet test --no-restore -p:TreatWarningsAsErrors=false

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install semgrep==1.136.0
      - run: semgrep --json --config .semgrep.yml src > semgrep-results.json || true
      - run: |
          python - <<'PY'
          import json
          import sys

          with open("semgrep-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file).get("results", [])

          if results:
              for result in results:
                  path = result.get("path", "<unknown>")
                  start = result.get("start", {})
                  line = start.get("line", "?")
                  check_id = result.get("check_id", "<unknown>")
                  message = result.get("extra", {}).get("message", "")
                  print(f"{path}:{line}: {check_id}: {message}")
              sys.exit(1)

          print("Semgrep completed with 0 findings.")
          PY
